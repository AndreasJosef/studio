<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sovereign Hall</title>
    <style>
      body {
        background: #0f0f0f;
        color: #00ff41;
        font-family: monospace;
        margin: 0;
      }
      #hall {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 10px;
        padding: 20px;
      }
      .stage {
        grid-column: 1 / -1;
        height: 60vh;
        background: #000;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border: 1px solid #333;
      }
      #telemetry {
        position: fixed;
        bottom: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.8);
        padding: 5px;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div id="hall">
      <video id="main-stage" class="stage" autoplay playsinline muted></video>
    </div>
    <div id="telemetry">SILICON_IDLE | NO_CONNECTION</div>

    <script src="logic.js"></script>
  </body>
</html>
