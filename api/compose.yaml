services:
  db:
    image: docker.io/library/postgres:18-alpine
    container_name: jc_postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data:Z
      - ./init-db:/docker-entrypoint-initdb.d:ro,Z
