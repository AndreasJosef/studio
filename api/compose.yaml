services:
  db:
    image: docker.io/library/postgres:18-alpine
    container_name: jc_postgres
    restart: always
    environment:
      - POSTGRES_USER=jcadmin
      - POSTGRES_PASSWORD=getajob
      - POSTGRES_DB=job_chaser_dev
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data:Z
