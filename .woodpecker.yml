# Studio CI/CD 2026

# Global configuration for the whole pipeline
when:
  - event: [push, manual]
    branch: prod

variables:
  - &ssh_connection
    host: 10.89.2.1 
    username: root
    key:
      from_secret: ssh_key

steps:
  # Force everything to be readable
  # This kills the "Permission Denied" issue once and for all
  prepare-workspace:
    image: alpine
    commands:
      - chmod -R +r .

  # 1. THE SYNC: Move the code from the CI container to the VPS disk
  sync-source:
    image: appleboy/drone-scp
    settings:
      <<: *ssh_connection
      target: /var/www/studio-deploy
      source: .
      exclude: [ ".git/*", "node_modules/*"]
      rm: true # Wipes old code in target first to keep it clean
      debug: true

  # JOBCHASER API: Build and Deploy directly on the host
  deploy-api:
    image: appleboy/drone-ssh
    settings:
      <<: *ssh_connection
      # 1. Correct v3 Secret Mapping (No environment block needed)
      JC_DATABASE_URL:
        from_secret: JC_DATABASE_URL
      JWT_SECRET:
        from_secret: JWT_SECRET
      
      # 2. This tells the plugin to find these keys and send them to your VPS
      envs: [ PLUGIN_JC_DATABASE_URL, PLUGIN_JWT_SECRET ]
      
      script:
        - cd /var/www/studio-deploy
        - podman build -t jc-api:latest -f apps/jobchaser/apps/api/Dockerfile .

        # DRIZZLE PUSH
        # We target the domain package specifically where the schema lives
        - >
          podman run --rm 
          --network host 
          -e DATABASE_URL=$$PLUGIN_JC_DATABASE_URL 
          jc-api:latest 
          pnpm --filter @jobchaser/domain exec drizzle-kit push
        - podman stop jc-api || true
        - podman rm jc-api || true
        - >
          podman run -d 
          --name jc-api 
          --restart always 
          --network host 
          -e DATABASE_URL=$$PLUGIN_JC_DATABASE_URL 
          -e JWT_SECRET=$$PLUGIN_JWT_SECRET 
          jc-api:latest
    when:
      - path: [ "apps/jobchaser/apps/api/**", "apps/jobchaser/packages/domain/**", "packages/**" ]

  # 3. JOBCHASER WEB: Build and Deploy
  deploy-web:
    image: appleboy/drone-ssh
    settings:
      <<: *ssh_connection
      script:
        - cd /var/www/studio-deploy
        - podman build -t jc-web:latest -f apps/jobchaser/apps/web/Dockerfile .
        - podman stop jc-web || true
        - podman rm jc-web || true
        - podman run -d --name jc-web --restart always --network host jc-web:latest
    when:
      - path: [ "apps/jobchaser/apps/web/**", "packages/**" ]
