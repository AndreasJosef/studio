# Studio CI/CD 2026

# Global configuration for the whole pipeline
when:
  - event: [push, manual]
    branch: prod

steps:
  # Force everything to be readable
  # This kills the "Permission Denied" issue once and for all
  prepare-workspace:
    image: alpine
    commands:
      - chmod -R +r .

  # 1. THE SYNC: Move the code from the CI container to the VPS disk
  sync-source:
    image: appleboy/drone-scp
    settings:
      host: 10.89.2.1
      username: root
      key:
        from_secret: ssh_key
      target: /var/www/studio-deploy
      source: .
      exclude: [ ".git/*", "node_modules/*", ".woodpecker.yml" ]
      rm: true # Wipes old code in target first to keep it clean
      debug: true

  # 2. JOBCHASER API: Build and Deploy directly on the host
  deploy-api:
    image: appleboy/drone-ssh
    settings:
      host: 127.0.0.1
      username: root
      key:
        from_secret: ssh_key
      # Injects secrets as environment variables for the SSH script
      envs: [ JC_DATABASE_URL, JWT_SECRET ]
      script:
        - cd /var/www/studio-deploy
        # Build the image using the host's Podman engine
        - podman build -t jc-api:latest -f apps/jobchaser/apps/api/Dockerfile .
        - podman stop jc-api || true
        - podman rm jc-api || true
        - >
          podman run -d 
          --name jc-api 
          --restart always 
          --network host 
          -e DATABASE_URL=$JC_DATABASE_URL 
          -e JWT_SECRET=$JWT_SECRET 
          jc-api:latest
    when:
      - path: [ "apps/jobchaser/apps/api/**", "apps/jobchaser/packages/domain/**", "packages/**" ]

  # 3. JOBCHASER WEB: Build and Deploy
  deploy-web:
    image: appleboy/drone-ssh
    settings:
      host: 127.0.0.1
      username: root
      key:
        from_secret: ssh_key
      script:
        - cd /var/www/studio-deploy
        - podman build -t jc-web:latest -f apps/jobchaser/apps/web/Dockerfile .
        - podman stop jc-web || true
        - podman rm jc-web || true
        - podman run -d --name jc-web --restart always --network host jc-web:latest
    when:
      - path: [ "apps/jobchaser/apps/web/**", "packages/**" ]
